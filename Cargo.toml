[workspace]
resolver = "3"
members = ["crates/shellspec"]
exclude = ["generated", "crates/shellspec-cli-contract"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
shellspec-cli-contract = { path = "crates/shellspec-cli-contract" }
brush-parser = "0.4.0"
tree-sitter = "0.25"
tree-sitter-fish = "3.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.10"
